name: Quick checks
on:
  pull_request:
  push:
    branches: [main, 'backend/**']
permissions:
  contents: read
  id-token: write
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Backend checks
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run setup
          npm run typecheck
          npm run test:ci
          npm run build
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm --prefix ../backend run test:frontend
          npm run build
          npm --prefix ../backend run test:gateway
      - name: Deploy tested main commit to VPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEPLOY_URL: https://javascope-api.193-233-246-241.sslip.io
          WEB_URL: https://javascope.193-233-246-241.sslip.io
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=javascope-deploy" | jq -r .value)
          echo "::add-mask::$token"
          git archive --format=tar.gz -o /tmp/javascope-release.tar.gz "$GITHUB_SHA"
          curl --fail-with-body --retry 2 -H "Authorization: Bearer $token" -H 'Content-Type: application/gzip' --data-binary @/tmp/javascope-release.tar.gz "$DEPLOY_URL/_deploy"
          for attempt in {1..90}; do
            revision=$(curl -fsS "$DEPLOY_URL/api/health" | jq -r .version || true)
            frontend_revision=$(curl -fsS "$WEB_URL/version.txt" || true)
            if [[ "$revision" == "$GITHUB_SHA" && "$frontend_revision" == "$GITHUB_SHA" ]]; then echo "Deployed frontend and backend $revision"; exit 0; fi
            sleep 2
          done
          echo 'Deployment did not become healthy within 180 seconds'; exit 1
