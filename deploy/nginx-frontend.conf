# The API rate-limit zones are declared by deploy/nginx.conf.
server {
    listen 80;
    server_name javascope.193-233-246-241.sslip.io;
    root /opt/javascope/current/frontend/dist;
    index index.html;
    client_max_body_size 4m;
    client_body_timeout 15s;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        limit_req zone=javascope_api burst=30 nodelay;
        limit_req_status 429;
        limit_conn javascope_connections 20;
        # Generated locally from /etc/javascope/backend.env, never committed.
        include /etc/nginx/snippets/javascope-gateway.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 250s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /api { return 404; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /version.txt {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
