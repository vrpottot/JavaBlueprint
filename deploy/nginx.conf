limit_req_zone $binary_remote_addr zone=javascope_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=javascope_connections:10m;
server {
    listen 80 default_server;
    server_name javascope-api.193-233-246-241.sslip.io;
    client_max_body_size 4m;
    client_body_timeout 15s;
    location /api/ {
        limit_req zone=javascope_api burst=30 nodelay;
        limit_req_status 429;
        limit_conn javascope_connections 20;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 250s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / { return 404; }
}
